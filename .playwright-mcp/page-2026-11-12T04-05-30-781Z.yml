      - generic [ref=e13]:
        - paragraph [ref=e14]: O second conditional fala de situações hipotéticas no presente ou no futuro — coisas imaginárias, improváveis ou conselhos. Conteúdo baseado na Unit 11 (Conditionals) do livro Destination C1–C2.
        - generic [ref=e15]:
          - heading "1. A forma básica" [level=2] [ref=e16]
          - paragraph [ref=e17]: "Estrutura: if + past simple (ou past continuous) na condição, would + infinitivo no resultado. O resultado descreve a consequência imaginária no presente ou no futuro."
          - paragraph [ref=e18]: "Na escrita, would quase sempre aparece contraído: I'd, you'd, he'd, she'd, we'd, they'd. Quando a oração com if vem primeiro, usamos vírgula separando as duas partes; quando o resultado vem primeiro, sem vírgula."
          - list [ref=e19]:
            - listitem [ref=e20]:
              - paragraph [ref=e21]: What would the local government do if there was an earthquake in the area?
              - paragraph [ref=e22]: O que o governo local faria se houvesse um terremoto na região?
              - paragraph [ref=e23]: "Exemplo do livro: condição improvável + consequência imaginária."
            - listitem [ref=e24]:
              - paragraph [ref=e25]: If I was/were a gambler, I'd put money on Jim being late.
              - paragraph [ref=e26]: Se eu fosse jogador, apostaria que o Jim vai se atrasar.
              - paragraph [ref=e27]: "I'd = I would. Was/were: ambos possíveis no inglês britânico."
          - generic [ref=e28]:
