        - generic [ref=e63]:
          - heading "3. Variações avançadas" [level=2] [ref=e64]
          - paragraph [ref=e65]: "Was/were: no inglês britânico, was e were são aceitos após if (were é mais formal); no americano, usa-se were. Com If I were you, o were é obrigatório nas duas variedades."
          - paragraph [ref=e66]: "Outros modais podem substituir o would no resultado: might e could. Unless equivale a if... not e também combina com o second conditional."
          - list [ref=e67]:
            - listitem [ref=e68]:
              - paragraph [ref=e69]: If the weather was better, we could have a picnic.
              - paragraph [ref=e70]: Se o tempo estivesse melhor, poderíamos fazer um piquenique.
              - paragraph [ref=e71]: "Could no lugar de would: possibilidade em vez de certeza."
            - listitem [ref=e72]:
              - paragraph [ref=e73]: Unless governments act now, the environment is really going to suffer.
              - paragraph [ref=e74]: A menos que os governos ajam agora, o meio ambiente vai sofrer muito.
              - paragraph [ref=e75]: Unless = if... not. Com passado (unless it rained...), o resultado vai para would.
          - generic [ref=e76]:
