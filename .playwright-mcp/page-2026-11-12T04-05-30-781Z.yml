          - heading "4. Conditionals mistos e inversão formal" [level=2] [ref=e86]
          - paragraph [ref=e87]: "Mistos: a condição e o resultado podem estar em tempos diferentes. Passado → presente: algo que aconteceu (ou não) no passado afeta o presente. Presente → passado: uma condição atual explica um resultado passado."
          - paragraph [ref=e88]: "Inversão formal: em estilo formal, o if pode sumir com Were + sujeito + to + infinitivo, com o mesmo sentido de If we stopped...."
